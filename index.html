<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5939d7"><title>บัญชีของฉัน</title><style>
:root{font-family:system-ui,'Noto Sans Thai',sans-serif;color:#1d2140;background:#f6f7fc}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.sidebar{width:236px;background:#181934;color:white;padding:26px 15px;position:sticky;top:0;height:100vh}.logo{font-weight:800;font-size:21px;margin:4px 13px 33px}.nav{display:block;width:100%;text-align:left;background:none;color:#c3c4da;padding:13px 16px;border-radius:11px;margin:5px 0}.nav.active{background:#613ee3;color:white;font-weight:700}.content{max-width:1210px;width:100%;padding:35px 32px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:25px;flex-wrap:wrap}h1{font-size:27px;margin:0}h2{font-size:18px;margin:0 0 18px}.muted{color:#777d92;font-size:13px}.btn{padding:11px 17px;border-radius:10px;background:#613ee3;color:#fff;font-weight:650}.btn.secondary{background:#eeebff;color:#5238b8}.btn.danger{background:#fff0f0;color:#b22f45}.btn.small{padding:7px 10px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card{background:white;border:1px solid #ebeaf4;border-radius:17px;padding:21px;box-shadow:0 5px 20px #25246c09}.label{font-size:13px;color:#737990}.value{font-size:27px;font-weight:800;margin-top:10px;white-space:nowrap}.purple{color:#603ee2}.green{color:#059968}.red{color:#d34a57}.blue{color:#2367ba}.panelgrid{display:grid;grid-template-columns:1.45fr 1fr;gap:17px;margin-top:17px}.panelgrid.equal{grid-template-columns:1fr 1fr}.filters{display:flex;gap:10px;margin:12px 0 18px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}.field input,.field select,.field textarea,.filters input,.filters select{border:1px solid #dadeec;border-radius:10px;padding:11px;background:#fff;min-width:0;color:#25253a}.filters>*{min-width:120px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field.full{grid-column:1/-1}.items{display:flex;flex-direction:column;gap:0}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #eff0f5}.item:last-child{border:0}.itemtitle{font-weight:650}.itemsub{font-size:12px;color:#8990a0;margin-top:3px}.right{text-align:right}.empty{padding:28px 8px;text-align:center;color:#82899a}.progress{height:10px;border-radius:20px;background:#eae8f4;overflow:hidden;margin:10px 0}.progress>div{height:100%;background:#6846ed;border-radius:20px}.chart{width:100%;height:235px}.legend{display:flex;gap:15px;font-size:12px;color:#71788e;flex-wrap:wrap}.dot{display:inline-block;width:9px;height:9px;border-radius:100%;margin-right:5px}.donut{width:170px;height:170px;border-radius:50%;margin:10px auto;position:relative}.donut:after{content:'';position:absolute;inset:37px;background:white;border-radius:50%}.nav-bottom{display:none}.fab{display:none}.notice{background:#fff7e8;color:#866326;padding:12px 15px;border-radius:11px;font-size:13px;margin-bottom:18px}.modal{position:fixed;inset:0;background:#10102388;display:none;align-items:center;justify-content:center;padding:16px;z-index:30}.modal.show{display:flex}.dialog{background:white;border-radius:18px;padding:24px;width:min(540px,100%);max-height:90vh;overflow:auto}.dialoghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}.hidden{display:none!important}.section{margin-top:17px}.accountrow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid #eee}.accountrow:last-child{border:0}.help{font-size:13px;line-height:1.8;color:#5b6278}.foot{font-size:12px;color:#9294a8;margin-top:30px}@media(max-width:950px){.stats{grid-template-columns:repeat(2,1fr)}.panelgrid,.panelgrid.equal{grid-template-columns:1fr}.sidebar{width:198px}.content{padding:25px 18px}}@media(max-width:650px){.sidebar{display:none}.content{padding:22px 14px 90px}.stats{gap:9px}.card{padding:15px}.value{font-size:21px}.top h1{font-size:22px}.nav-bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;box-shadow:0 -4px 22px #28225c18;z-index:12;justify-content:space-around;padding:7px 4px env(safe-area-inset-bottom)}.nav-bottom button{font-size:11px;color:#76758d;background:none;padding:6px 3px;min-width:55px}.nav-bottom button.active{color:#5b3add;font-weight:800}.formgrid{grid-template-columns:1fr}.value{white-space:normal}.fab{display:flex;align-items:center;justify-content:center;position:fixed;right:18px;bottom:calc(83px + env(safe-area-inset-bottom));z-index:20;border-radius:28px;padding:15px 19px;background:#613ee3;color:white;box-shadow:0 9px 27px #34228c55;font-size:15px;font-weight:800}.top>.btn{display:none}.dialog{padding:18px;max-height:88dvh}}
</style></head><body><div class="app"><aside class="sidebar"><div class="logo">💜 บัญชีของฉัน</div><div id="desktopnav"></div></aside><main class="content"><div class="top"><div><h1 id="page-title">ภาพรวมการเงิน</h1><div class="muted" id="today"></div></div><button class="btn" onclick="openTransaction()">＋ เพิ่มรายการ</button></div><div class="notice">🔒 ข้อมูลเก็บในเบราว์เซอร์ของเครื่องนี้เท่านั้น ยังไม่ซิงก์ Google Sheets หรือเครื่องอื่น กรุณาสำรองข้อมูลเป็นประจำ</div><div id="view"></div><div class="foot">บัญชีของฉัน • ใช้งานส่วนตัว • ยอดทั้งหมดเป็นเงินบาท (THB)</div></main></div><nav class="nav-bottom" id="mobilenav"></nav><button class="fab" type="button" onclick="openTransaction()" aria-label="เพิ่มรายการรายรับหรือรายจ่าย">＋ เพิ่มรายการ</button><div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="dialog"><div class="dialoghead"><h2 id="modal-title" style="margin:0"></h2><button class="btn secondary small" onclick="closeModal()">✕</button></div><div id="modal-content"></div></div></div><script>
'use strict';
const KEY='abas-finance-v1',categories={expense:['อาหาร','ที่พัก','เดินทาง','ค่าน้ำ-ไฟ','อินเทอร์เน็ต','สุขภาพ','ครอบครัว','ออกกำลังกาย','ช้อปปิ้ง','การศึกษา','น้ำมัน','ซักผ้า','ของรางวัล','AI Tools','เงินให้ครอบครัว','เงินเตรียมจ่าย กยศ.','เงินฉุกเฉิน (EF)','เงินลงทุน (DCA)','Buffer','อื่น ๆ'],income:['เงินเดือน','รายได้เสริม','โบนัส','ของขวัญ','อื่น ๆ']},money=n=>new Intl.NumberFormat('th-TH',{style:'currency',currency:'THB',maximumFractionDigits:2}).format(n||0),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),month=d=>d.slice(0,7),currentMonth=new Date().toLocaleDateString('sv-SE').slice(0,7),uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();
const defaults=()=>({accounts:[{id:'cash',name:'เงินสด',opening:0},{id:'bank',name:'บัญชีธนาคาร',opening:0}],transactions:[],budgets:{},goal:100000});let state;try{state=JSON.parse(localStorage.getItem(KEY))||defaults();if(!Array.isArray(state.accounts)||!Array.isArray(state.transactions))throw 0;}catch(e){state=defaults();alert('ข้อมูลที่บันทึกไม่สามารถอ่านได้ กรุณานำเข้าไฟล์สำรองหากมี');}let tab='dashboard',editing=null,search='',filterType='all',filterMonth=currentMonth;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('ไม่สามารถบันทึกข้อมูลได้ โปรดสำรองข้อมูลและตรวจสอบพื้นที่จัดเก็บ');return false}render();if(window.cloudSync)window.cloudSync.afterSave();return true}
function balance(a){return Number(a.opening||0)+state.transactions.reduce((n,t)=>n+(t.account===a.id&&t.type==='income'?Number(t.amount):0)-(t.account===a.id&&t.type==='expense'?Number(t.amount):0)+(t.type==='transfer'&&t.to===a.id?Number(t.amount):0)-(t.type==='transfer'&&t.account===a.id?Number(t.amount):0),0)}
function totals(m){const tx=state.transactions.filter(t=>month(t.date)===m);return {income:tx.filter(t=>t.type==='income').reduce((s,t)=>s+ +t.amount,0),expense:tx.filter(t=>t.type==='expense').reduce((s,t)=>s+ +t.amount,0)}}
const tabs=[['dashboard','◫','ภาพรวม'],['transactions','☷','รายการ'],['accounts','▣','บัญชี'],['budgets','◎','งบประมาณ'],['reports','▤','รายงาน'],['settings','⚙','ตั้งค่า']];function nav(){document.getElementById('desktopnav').innerHTML=tabs.map(([k,i,n])=>`<button class="nav ${tab===k?'active':''}" onclick="go('${k}')">${i} &nbsp;${n}</button>`).join('');document.getElementById('mobilenav').innerHTML=tabs.map(([k,i,n])=>`<button class="${tab===k?'active':''}" onclick="go('${k}')"><div style="font-size:19px">${i}</div>${n}</button>`).join('')}
function go(k){tab=k;render();scrollTo(0,0)}function render(){nav();document.getElementById('page-title').textContent={dashboard:'ภาพรวมการเงิน',transactions:'รายการรายรับ–รายจ่าย',accounts:'บัญชีของฉัน',budgets:'งบประมาณและเป้าหมาย',reports:'รายงานการเงิน',settings:'ตั้งค่าและสำรองข้อมูล'}[tab];document.getElementById('today').textContent=new Intl.DateTimeFormat('th-TH',{dateStyle:'full'}).format(new Date());document.getElementById('view').innerHTML=({dashboard,transactions,accounts,budgets,reports,settings}[tab])()}
function stat(label,value,color){return `<div class="card"><div class="label">${label}</div><div class="value ${color}">${money(value)}</div></div>`}
function chart(){const months=Array.from({length:6},(_,i)=>{let d=new Date;d.setDate(1);d.setMonth(d.getMonth()-5+i);return d.toLocaleDateString('sv-SE').slice(0,7)});let sets=months.map(m=>totals(m)),max=Math.max(100,...sets.flatMap(x=>[x.income,x.expense]));let points=key=>sets.map((a,i)=>`${48+i*92},${185-a[key]/max*145}`).join(' ');return `<svg viewBox="0 0 530 225" class="chart" role="img" aria-label="กราฟรายรับรายจ่ายหกเดือน"><line x1="44" y1="185" x2="516" y2="185" stroke="#d4d6e4"/>${[0,1,2,3].map(i=>`<line x1="44" x2="516" y1="${40+i*48}" y2="${40+i*48}" stroke="#efeff7"/>`).join('')}<polyline fill="none" stroke="#0aa77b" stroke-width="3" points="${points('income')}"/><polyline fill="none" stroke="#e65a67" stroke-width="3" points="${points('expense')}"/>${months.map((m,i)=>`<text x="${48+i*92}" y="208" text-anchor="middle" fill="#878a9a" font-size="11">${m.slice(5)}/${m.slice(2,4)}</text>`).join('')}</svg><div class="legend"><span><span class="dot" style="background:#0aa77b"></span>รายรับ</span><span><span class="dot" style="background:#e65a67"></span>รายจ่าย</span></div>`}
function expenses(m){let sums={};state.transactions.filter(t=>t.type==='expense'&&month(t.date)===m).forEach(t=>sums[t.category]=(sums[t.category]||0)+ +t.amount);return Object.entries(sums).sort((a,b)=>b[1]-a[1])}
function pie(m){let data=expenses(m);if(!data.length)return '<div class="empty">ยังไม่มีข้อมูลรายจ่ายเดือนนี้</div>';const colors=['#613ee3','#ffae21','#1b76d2','#dc435c','#1ba379','#9b69dc','#888'],sum=data.reduce((s,x)=>s+x[1],0);let cur=0;const stops=data.map(([k,v],i)=>{let a=cur;cur+=v/sum*100;return `${colors[i%colors.length]} ${a}% ${cur}%`}).join(',');return `<div class="donut" style="background:conic-gradient(${stops})"></div>${data.map(([k,v],i)=>`<div class="item"><span><span class="dot" style="background:${colors[i%colors.length]}"></span>${esc(k)}</span><b>${money(v)}</b></div>`).join('')}`}
function list(tx,limit=0){let arr=[...tx].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));if(limit)arr=arr.slice(0,limit);return arr.length?`<div class="items">${arr.map(t=>`<div class="item"><div><div class="itemtitle">${esc(t.type==='transfer'?'โอนเงิน':t.category||'รายการ')}</div><div class="itemsub">${esc(t.date)} · ${esc(state.accounts.find(a=>a.id===t.account)?.name||'บัญชีที่ลบ')} ${t.type==='transfer'?'→ '+esc(state.accounts.find(a=>a.id===t.to)?.name||'บัญชีที่ลบ'):''}${t.note?' · '+esc(t.note):''}</div></div><div class="right"><div class="${t.type==='income'?'green':t.type==='expense'?'red':'blue'}" style="font-weight:750">${t.type==='income'?'+':t.type==='expense'?'-':'⇄ '}${money(t.amount)}</div><button class="btn secondary small" onclick="openTransaction('${t.id}')">แก้ไข</button> <button class="btn danger small" onclick="delTx('${t.id}')">ลบ</button></div></div>`).join('')}</div>`:'<div class="empty">ยังไม่มีรายการ เริ่มต้นด้วยปุ่ม “เพิ่มรายการ”</div>'}
function dashboard(){const t=totals(currentMonth),sum=state.accounts.reduce((s,a)=>s+balance(a),0);return `<div class="stats">${stat('ยอดเงินทุกบัญชี',sum,'purple')}${stat('รายรับเดือนนี้',t.income,'green')}${stat('รายจ่ายเดือนนี้',t.expense,'red')}${stat('กระแสเงินสดสุทธิ',t.income-t.expense,'blue')}</div><div class="panelgrid"><div class="card"><h2>รายรับ–รายจ่าย 6 เดือนล่าสุด</h2>${chart()}</div><div class="card"><h2>รายจ่ายตามหมวดหมู่เดือนนี้</h2>${pie(currentMonth)}</div></div><div class="panelgrid equal"><div class="card"><h2>เงินฉุกเฉิน</h2>${fundCard("ef")}</div><div class="card"><h2>เงินออมทั่วไป</h2>${fundCard("savings")}</div></div><div class="panelgrid equal"><div class="card"><h2>รายรับรอจัดสรร</h2>${allocationCard()}</div><div class="card"><h2>รายการล่าสุด</h2>${list(state.transactions,4)}</div></div>`}
function transactions(){let tx=state.transactions.filter(t=>(filterType==='all'||t.type===filterType)&&(filterMonth==='all'||month(t.date)===filterMonth)&&`${t.category||''} ${t.note||''}`.toLowerCase().includes(search.toLowerCase()));return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><h2 style="margin:0">ประวัติรายการ</h2><button class="btn" onclick="openTransaction()">＋ เพิ่มรายการ</button></div><div class="filters"><input aria-label="ค้นหารายการ" placeholder="ค้นหาหมวดหมู่หรือหมายเหตุ" value="${esc(search)}" oninput="search=this.value;render()"><select onchange="filterType=this.value;render()"><option value="all">ทุกประเภท</option>${[['income','รายรับ'],['expense','รายจ่าย'],['transfer','โอนเงิน']].map(([v,n])=>`<option value="${v}" ${filterType===v?'selected':''}>${n}</option>`).join('')}</select><input aria-label="เดือน" type="month" value="${filterMonth==='all'?currentMonth:filterMonth}" onchange="filterMonth=this.value;render()"><button class="btn secondary" onclick="filterMonth='all';render()">ทุกเดือน</button></div>${list(tx)}</div>`}
function accounts(){return `<div class="card"><div class="top"><h2>บัญชีทั้งหมด</h2><button class="btn secondary" onclick="openAccount()">＋ เพิ่มบัญชี</button></div>${state.accounts.map(a=>`<div class="accountrow"><div><b>${esc(a.name)}</b><div class="muted">ยอดตั้งต้น ${money(a.opening)}</div></div><div class="right"><b class="purple">${money(balance(a))}</b><div><button class="btn secondary small" onclick="openAccount('${a.id}')">แก้ไข</button> <button class="btn danger small" onclick="delAccount('${a.id}')">ลบ</button></div></div></div>`).join('')}</div><div class="section muted">ยอดบัญชี = ยอดตั้งต้น + รายรับ − รายจ่าย ± เงินโอนเข้าออก</div>`}
function fundCard(kind){const ef=kind==='ef',id=ef?state.efAccountId:state.savingsAccountId,target=ef?(Number(state.goal)||100000):(Number(state.savingsGoal)||0),account=state.accounts.find(a=>a.id===id),title=ef?'เงินฉุกเฉิน (EF)':'เงินออมทั่วไป';if(!account)return `<div class="label">${title}</div><div class="empty">ยังไม่ได้กำหนดบัญชีสำหรับ${title} — ไม่ใช้ยอดรวมทุกบัญชี</div><button class="btn secondary" onclick="openGoal()">ตั้งค่าบัญชี</button>`;const amount=balance(account),pct=target>0?Math.min(100,Math.max(0,amount/target*100)):0;return `<div class="label">${title} · ${esc(account.name)}</div><div class="value purple">${money(amount)}</div><div class="muted">เป้าหมาย ${target>0?money(target):'ยังไม่กำหนด'}</div><div class="progress"><div style="width:${pct}%"></div></div><b>${target>0?pct.toFixed(1)+'%':'—'}</b> <button class="btn secondary small" onclick="openGoal()">ตั้งค่า</button>`}
function goalCard(){return fundCard('ef')}
function allocationCard(){const a=state.accounts.find(a=>a.id===state.unallocatedAccountId);return `<div class="label">รายรับรอจัดสรร (ยังไม่ใช่เงินออม)</div>${a?`<div class="value blue">${money(balance(a))}</div><div class="muted">จากบัญชี ${esc(a.name)} · ใช้รายการโอนเงินเพื่อจัดสรรไปบัญชีเงินออมหรือ EF</div>`:`<div class="empty">ยังไม่ได้เลือกบัญชีพักรายรับ 32,000 บาทจะไม่ถูกนับเป็นเงินออมหรือเงินฉุกเฉิน</div>`}<button class="btn secondary small" onclick="openGoal()">เลือกบัญชีพักรายรับ</button>`}
function budgetCategories(){return [...new Set([...categories.expense,...(Array.isArray(state.customExpenseCategories)?state.customExpenseCategories:[]),...Object.keys(state.budgets||{})])]}function budgets(){let spent=expenses(currentMonth);return `<div class="panelgrid equal"><div class="card"><h2>งบประมาณเดือนปัจจุบัน</h2>${budgetCategories().map(k=>{let target=Number(state.budgets[k]||0),used=spent.find(x=>x[0]===k)?.[1]||0;return `<div style="margin:14px 0"><div style="display:flex;justify-content:space-between;gap:8px"><b>${k}</b><span class="muted">${money(used)} / ${target?money(target):'ยังไม่กำหนด'}</span></div><div class="progress"><div style="width:${target?Math.min(100,used/target*100):0}%;background:${target&&used>target?'#dc435c':'#6846ed'}"></div></div></div>`}).join('')}<button class="btn" onclick="openBudget()">ตั้งงบประมาณ</button></div><div class="card"><h2>เป้าหมายเงินออม</h2>${goalCard()}<button class="btn secondary" onclick="openGoal()">แก้ไขเป้าหมาย</button></div></div>`}
function reports(){let years=[...new Set([currentMonth.slice(0,4),...state.transactions.map(x=>x.date.slice(0,4))])].sort().reverse();return `<div class="card"><div class="top"><h2>สรุปรายเดือน</h2><button class="btn secondary" onclick="exportCSV()">⬇ ส่งออก CSV</button></div><div class="items">${years.flatMap(y=>Array.from({length:12},(_,i)=>`${y}-${String(i+1).padStart(2,'0')}`)).filter(m=>m<=currentMonth).map(m=>{let t=totals(m);return `<div class="item"><b>${m}</b><div class="right"><span class="green">รับ ${money(t.income)}</span> · <span class="red">จ่าย ${money(t.expense)}</span><div><b>สุทธิ ${money(t.income-t.expense)}</b></div></div></div>`}).join('')}</div></div>`}
function cloudSettings(){const c=window.cloudSync?.configured()||{};return `<div class="card section"><h2>☁ Google Sheets — บันทึกอัตโนมัติ</h2><p class="help">เชื่อมต่อด้วย Google OAuth ไม่เก็บรหัสผ่านหรือ Access Token ใน GitHub ข้อมูลในเครื่องยังคงอยู่จนกว่าคุณจะเลือกย้ายหรือโหลดจากชีตเอง หากไม่ได้เปิดแอปและเข้าสู่ระบบ Google อีกครั้ง การซิงก์จะยังไม่ทำงาน</p><div class="formgrid"><label class="field full">Google OAuth Client ID<input id="google-client" value="${esc(c.clientId||'')}" placeholder="xxxxxxxx.apps.googleusercontent.com"></label><label class="field full">Google Spreadsheet ID<input id="google-sheet" value="${esc(c.sheetId||'')}" placeholder="จาก URL ของ Google Sheets"></label></div><div class="actions" style="justify-content:flex-start;flex-wrap:wrap"><button class="btn secondary" onclick="cloudSync.saveSettings()">บันทึกการตั้งค่า</button><button class="btn" onclick="cloudSync.connect()">เชื่อมต่อ Google</button></div><p id="cloud-status" class="help">ยังไม่เชื่อมต่อ Google Sheets</p><p class="help">ตั้งค่าใน Google Cloud Console: เปิด Google Sheets API สร้าง OAuth Client ประเภท Web Application เพิ่ม JavaScript Origin: https://abasmahachi3-ai.github.io และเพิ่มตัวเองเป็น Test user หากแอปอยู่ในโหมด Testing จากนั้นสร้าง Google Sheets ในบัญชีของคุณและใส่ Spreadsheet ID ด้านบน</p></div>`}
function settings(){return `${cloudSettings()}<div class="panelgrid equal"><div class="card"><h2>สำรองและกู้คืนข้อมูล</h2><p class="help">บันทึกไฟล์ JSON ไว้ในที่ปลอดภัย โดยเฉพาะก่อนล้างข้อมูลเบราว์เซอร์หรือเปลี่ยนโทรศัพท์</p><button class="btn" onclick="backup()">⬇ ดาวน์โหลดไฟล์สำรอง JSON</button><p><label class="field">นำเข้าไฟล์สำรอง (แทนที่ข้อมูลปัจจุบัน)<input type="file" accept=".json,application/json" onchange="restore(event)"></label></p></div><div class="card"><h2>ข้อมูลและความปลอดภัย</h2><p class="help">ข้อมูลเก็บในเครื่องก่อนเสมอ สามารถเปิดการซิงก์กับ Google Sheets ได้ที่ด้านล่าง โดยต้องยืนยันบัญชี Google ก่อน</p><button class="btn danger" onclick="clearAll()">ล้างข้อมูลทั้งหมด</button></div></div>`}
function modal(title,html){document.getElementById('modal-title').textContent=title;document.getElementById('modal-content').innerHTML=html;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}
function openTransaction(id){if(!state.accounts.length){alert('กรุณาเพิ่มบัญชีก่อน');go('accounts');return}const t=state.transactions.find(t=>t.id===id)||{type:'expense',amount:'',date:new Date().toLocaleDateString('sv-SE'),account:state.accounts[0]?.id,category:'อาหาร',note:''};editing=id||null;modal(id?'แก้ไขรายการ':'เพิ่มรายการ',`<form onsubmit="submitTx(event)"><div class="formgrid"><label class="field">ประเภท<select id="tx-type" onchange="txFields()">${[['expense','รายจ่าย'],['income','รายรับ'],['transfer','โอนระหว่างบัญชี']].map(([v,n])=>`<option value="${v}" ${t.type===v?'selected':''}>${n}</option>`).join('')}</select></label><label class="field">จำนวนเงิน (บาท)<input id="tx-amount" required type="number" min="0.01" step="0.01" value="${esc(t.amount)}"></label><label class="field">วันที่<input id="tx-date" required type="date" value="${esc(t.date)}"></label><label class="field">บัญชีต้นทาง<select id="tx-account">${state.accounts.map(a=>`<option value="${a.id}" ${t.account===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></label><label class="field" id="categorywrap">หมวดหมู่<select id="tx-category"></select></label><label class="field hidden" id="towrap">โอนไปบัญชี<select id="tx-to">${state.accounts.map(a=>`<option value="${a.id}" ${t.to===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></label><label class="field full">หมายเหตุ<textarea id="tx-note" rows="2">${esc(t.note)}</textarea></label></div><div class="actions"><button type="button" class="btn secondary" onclick="closeModal()">ยกเลิก</button><button class="btn">บันทึก</button></div></form>`);txFields(t.category);document.getElementById('tx-amount').focus()}
function txFields(chosen){let type=document.getElementById('tx-type').value,transfer=type==='transfer';document.getElementById('categorywrap').classList.toggle('hidden',transfer);document.getElementById('towrap').classList.toggle('hidden',!transfer);document.getElementById('tx-category').innerHTML=(type==='expense'?budgetCategories():(categories[type]||[])).map(k=>`<option ${k===chosen?'selected':''}>${k}</option>`).join('')}
function submitTx(e){e.preventDefault();let type=document.getElementById('tx-type').value,amount=Number(document.getElementById('tx-amount').value),account=document.getElementById('tx-account').value,to=document.getElementById('tx-to').value;if(!Number.isFinite(amount)||amount<=0)return alert('กรุณาระบุจำนวนเงินมากกว่า 0');if(type==='transfer'&&account===to)return alert('บัญชีต้นทางและปลายทางต้องแตกต่างกัน');let t={id:editing||uid(),type,amount,date:document.getElementById('tx-date').value,account,to:type==='transfer'?to:undefined,category:type==='transfer'?'':document.getElementById('tx-category').value,note:document.getElementById('tx-note').value.trim()};if(editing)state.transactions=state.transactions.map(x=>x.id===editing?t:x);else state.transactions.push(t);closeModal();save()}
function delTx(id){if(confirm('ลบรายการนี้ใช่ไหม?')){state.transactions=state.transactions.filter(t=>t.id!==id);save()}}
function openAccount(id){let a=state.accounts.find(a=>a.id===id)||{name:'',opening:0};modal(id?'แก้ไขบัญชี':'เพิ่มบัญชี',`<form onsubmit="submitAccount(event,'${id||''}')"><div class="formgrid"><label class="field full">ชื่อบัญชี<input id="a-name" required maxlength="50" value="${esc(a.name)}" placeholder="เช่น ธนาคาร A"></label><label class="field full">ยอดตั้งต้น (บาท)<input id="a-opening" type="number" step="0.01" required value="${a.opening}"></label></div><div class="actions"><button class="btn">บันทึก</button></div></form>`)}function submitAccount(e,id){e.preventDefault();let a={id:id||uid(),name:document.getElementById('a-name').value.trim(),opening:Number(document.getElementById('a-opening').value)};if(!a.name||!Number.isFinite(a.opening))return;if(id)state.accounts=state.accounts.map(x=>x.id===id?a:x);else state.accounts.push(a);closeModal();save()}function delAccount(id){if(state.transactions.some(t=>t.account===id||t.to===id))return alert('บัญชีนี้มีประวัติธุรกรรมอยู่ ไม่สามารถลบได้ กรุณาแก้ไขรายการก่อน');if(confirm('ลบบัญชีนี้ใช่ไหม?')){state.accounts=state.accounts.filter(a=>a.id!==id);save()}}
function openBudget(){modal('ตั้งงบประมาณต่อเดือน',`<div class="notice">ต้องการหมวดอื่น? กดเพิ่มหมวดหมู่ด้านล่างได้เลย</div><form onsubmit="submitBudget(event)"><div class="formgrid">${budgetCategories().map((k,i)=>`<label class="field">${esc(k)}<input type="number" min="0" step="1" id="budget${i}" value="${Number(state.budgets[k]||0)}"></label>`).join('')}</div><div class="actions"><button type="button" class="btn secondary" onclick="addBudgetCategory()">＋ เพิ่มหมวดหมู่</button><button class="btn">บันทึก</button></div></form>`)}function submitBudget(e){e.preventDefault();budgetCategories().forEach((k,i)=>state.budgets[k]=Number(document.getElementById('budget'+i).value)||0);closeModal();save()}function addBudgetCategory(){const name=prompt('ชื่อหมวดหมู่รายจ่ายใหม่ เช่น ค่าเดินทางท่องเที่ยว');if(name===null)return;const clean=name.trim();if(!clean)return alert('กรุณาระบุชื่อหมวดหมู่');if(clean.length>50)return alert('ชื่อหมวดหมู่ยาวเกิน 50 ตัวอักษร');if(budgetCategories().some(k=>k.toLowerCase()===clean.toLowerCase()))return alert('มีหมวดหมู่นี้อยู่แล้ว');budgetCategories().forEach((k,i)=>{const el=document.getElementById('budget'+i);if(el)state.budgets[k]=Number(el.value)||0});state.customExpenseCategories=Array.isArray(state.customExpenseCategories)?state.customExpenseCategories:[];state.customExpenseCategories.push(clean);closeModal();save();openBudget()}
function openGoal(){const opts=(id)=>`<option value="">-- ยังไม่เลือก --</option>${state.accounts.map(a=>`<option value="${esc(a.id)}" ${id===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}`;modal('แยกเงินออม เงินฉุกเฉิน และรายรับรอจัดสรร',`<form onsubmit="submitGoal(event)"><div class="formgrid"><label class="field full">บัญชีพักรายรับรอจัดสรร<select id="unallocated-account">${opts(state.unallocatedAccountId)}</select></label><label class="field full">บัญชีเงินออมทั่วไป<select id="savings-account">${opts(state.savingsAccountId)}</select></label><label class="field full">เป้าหมายเงินออมทั่วไป (บาท)<input id="savings-goal" type="number" min="0" step="0.01" value="${Number(state.savingsGoal)||0}"></label><label class="field full">บัญชีเงินฉุกเฉิน (EF)<select id="ef-account">${opts(state.efAccountId)}</select></label><label class="field full">เป้าหมายเงินฉุกเฉิน (บาท)<input id="goal" type="number" min="1" step="0.01" value="${Number(state.goal)||100000}" required></label></div><p class="help">ทั้ง 3 ประเภทต้องเป็นบัญชีคนละรายการ ระบบจะไม่นับรายรับ 32,000 บาทเป็นเงินออมหรือ EF โดยอัตโนมัติ หากยังไม่ได้สร้างบัญชีเหล่านี้ให้เพิ่มที่เมนู “บัญชี” ก่อน แล้วใช้ “โอนเงิน” เมื่อจัดสรรเงินจริง</p><div class="actions"><button class="btn">บันทึก</button></div></form>`)}
function submitGoal(e){e.preventDefault();const ef=document.getElementById('ef-account').value,sv=document.getElementById('savings-account').value,ua=document.getElementById('unallocated-account').value,ids=[ef,sv,ua].filter(Boolean),goal=Number(document.getElementById('goal').value),savingsGoal=Number(document.getElementById('savings-goal').value);if(new Set(ids).size!==ids.length)return alert('กรุณาเลือกบัญชีคนละรายการสำหรับเงินออม EF และรายรับรอจัดสรร');if(ids.some(id=>!state.accounts.some(a=>a.id===id)))return alert('ไม่พบบัญชีที่เลือก');if(!Number.isFinite(goal)||goal<=0||!Number.isFinite(savingsGoal)||savingsGoal<0)return alert('เป้าหมายไม่ถูกต้อง');state.efAccountId=ef;state.savingsAccountId=sv;state.unallocatedAccountId=ua;state.goal=goal;state.savingsGoal=savingsGoal;closeModal();save()}
function download(filename,content,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function backup(){download('finance-backup-'+new Date().toLocaleDateString('sv-SE')+'.json',JSON.stringify(state,null,2),'application/json')}function exportCSV(){let rows=[['วันที่','ประเภท','หมวดหมู่','จำนวนเงิน','บัญชีต้นทาง','บัญชีปลายทาง','หมายเหตุ'],...state.transactions.map(t=>[t.date,t.type,t.category||'',t.amount,state.accounts.find(a=>a.id===t.account)?.name||'',state.accounts.find(a=>a.id===t.to)?.name||'',t.note||''])];download('finance-transactions.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}
async function restore(e){let f=e.target.files[0];if(!f)return;try{let v=JSON.parse(await f.text());if(!Array.isArray(v.accounts)||!Array.isArray(v.transactions)||!v.accounts.every(a=>typeof a.id==='string'&&typeof a.name==='string'&&Number.isFinite(+a.opening))||!v.transactions.every(t=>['income','expense','transfer'].includes(t.type)&&typeof t.date==='string'&&Number.isFinite(+t.amount)&& +t.amount>0))throw Error('โครงสร้างข้อมูลไม่ถูกต้อง');if(!confirm('นำเข้าไฟล์นี้แล้วแทนที่ข้อมูลเดิมทั้งหมดใช่ไหม?'))return;state={accounts:v.accounts,transactions:v.transactions,budgets:v.budgets||{},goal:Number(v.goal)||100000};save();alert('นำเข้าข้อมูลเรียบร้อย')}catch(err){alert('นำเข้าไม่สำเร็จ: '+err.message)}e.target.value=''}function clearAll(){if(confirm('ยืนยันล้างข้อมูลทั้งหมด? กรุณาดาวน์โหลดไฟล์สำรองก่อน')&&confirm('ยืนยันอีกครั้ง: ข้อมูลปัจจุบันจะหายไป')){state=defaults();save()}}render();
</script><script src="https://accounts.google.com/gsi/client" async defer></script><script src="google-sync.js"></script></body></html>
